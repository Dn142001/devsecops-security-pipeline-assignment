name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: onboarding-app:${{ github.sha }}

jobs:
  security-build-test:
    name: SCA, SAST, build, deploy and DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: SCA gate - repository dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: SAST gate - source code
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics=off \
            .

      - name: Build application image
        run: docker build --pull --tag "${IMAGE_NAME}" .

      - name: SCA gate - built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Start test deployment
        run: |
          docker run --detach \
            --name onboarding-app \
            --publish 8080:8080 \
            "${IMAGE_NAME}"

      - name: Wait for the application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs onboarding-app
          exit 1



      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports-${{ github.run_number }}
          path: |
            zap-output/zap-report.html
            zap-output/zap-report.json
            
            if-no-files-found: warn
          retention-days: 14

      - name: Show application logs
        if: failure()
        run: docker logs onboarding-app || true

      - name: Remove test deployment
        if: always()
        run: docker rm --force onboarding-app || true

